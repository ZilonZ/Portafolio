<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="6" fill="#0d1f3c"/>
  <!-- Border -->
  <rect x="1" y="1" width="62" height="62" rx="5.5" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
  <!-- Corner accents -->
  <polyline points="1,12 1,1 12,1" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="52,63 63,63 63,52" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Z — top bar -->
  <rect x="14" y="14" width="36" height="8" rx="1" fill="#00d4ff"/>
  <!-- Z — diagonal -->
  <polygon points="50,22 40,22 14,42 24,42" fill="#00d4ff"/>
  <!-- Z — bottom bar -->
  <rect x="14" y="42" width="36" height="8" rx="1" fill="#00d4ff"/>
  <!-- Glow dots -->
  <circle cx="57" cy="9" r="2.5" fill="#00d4ff" opacity="0.6"/>
  <circle cx="7" cy="55" r="2.5" fill="#00d4ff" opacity="0.4"/>
</svg>
